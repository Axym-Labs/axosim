[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axosim"
version = "0.1.0"
description = "AxoSim surrogate-model harness for biologically inspired neural simulation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "requests>=2.32",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
axosim = "axosim.cli:main"
axosim-evaluate-model = "axosim.axobench_iteration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
